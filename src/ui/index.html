<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Stream Topic Copilot</title>
  </head>
  <body class="bg-body-tertiary">
    <main class="container py-3">
      <div class="row justify-content-center">
        <div class="col-12 col-xl-5">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
            <nav class="nav nav-pills gap-2">
              <button class="tab nav-link active py-1 px-2 small" data-tab="config" type="button">Config</button>
              <button class="tab nav-link py-1 px-2 small" data-tab="live" type="button">Live</button>
              <button class="tab nav-link py-1 px-2 small" data-tab="history" type="button">History</button>
            </nav>
            <div class="d-flex flex-wrap gap-2">
              <span id="error-pill" class="badge text-bg-danger d-none">Connection error</span>
              <div id="live-tab-status" class="d-none flex-wrap gap-2">
                <span id="permission-pill" class="badge text-bg-secondary">Mic: unknown</span>
                <span id="session-pill" class="badge text-bg-secondary">No active session</span>
              </div>
            </div>
          </div>

          <section id="tab-config" class="tab-panel">
            <div class="vstack gap-3">
              <div class="card">
                <div class="card-body">
                  <h2 class="h6 card-title">Setup</h2>
                  <div class="mb-3">
                    <label class="form-label small" for="markdown-path">Markdown topics file</label>
                    <input id="markdown-path" class="form-control form-control-sm" type="text" />
                  </div>
                  <div class="mb-3">
                    <label class="form-label small" for="microphone-id">Microphone</label>
                    <select id="microphone-id" class="form-select form-select-sm"></select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label small" for="mic-level-bar">Microphone activity</label>
                    <div class="progress" role="progressbar" aria-label="Microphone activity">
                      <div id="mic-level-bar" class="progress-bar" style="width: 0%"></div>
                    </div>
                    <div id="mic-level-meta" class="form-text small">No probe data yet.</div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label small" for="stt-provider">STT provider</label>
                    <select id="stt-provider" class="form-select form-select-sm"></select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label small" for="analysis-provider">Analysis provider</label>
                    <select id="analysis-provider" class="form-select form-select-sm"></select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label small" for="chunk-sensitivity">Chunk sensitivity</label>
                    <select id="chunk-sensitivity" class="form-select form-select-sm">
                      <option value="low">Low</option>
                      <option value="medium">Medium</option>
                      <option value="high">High</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label small" for="analysis-threshold">Auto-apply threshold</label>
                    <input id="analysis-threshold" class="form-range" type="range" min="0" max="1" step="0.05" />
                    <div id="analysis-threshold-label" class="form-text small"></div>
                  </div>
                  <div class="d-flex flex-wrap gap-2">
                    <button id="save-config" class="btn btn-sm btn-primary" type="button">Save config</button>
                    <button id="refresh-state" class="btn btn-sm btn-outline-secondary" type="button">Refresh devices</button>
                    <button id="start-session" class="btn btn-sm btn-outline-primary" type="button">Start session</button>
                  </div>
                </div>
              </div>

              <div class="card">
                <div class="card-body">
                  <h2 class="h6 card-title">Microphone Diagnostics</h2>
                  <div id="microphone-diagnostics" class="vstack gap-2 text-body-secondary small">No microphone diagnostics yet.</div>
                </div>
              </div>

              <div class="card">
                <div class="card-body">
                  <h2 class="h6 card-title">Resume</h2>
                  <div id="resume-list" class="vstack gap-2 text-body-secondary small">No resumable sessions.</div>
                </div>
              </div>
            </div>
          </section>

          <section id="tab-live" class="tab-panel d-none">
            <div class="vstack gap-3">
              <div>
                <div class="btn-group btn-group-sm mb-2" role="group" aria-label="Live controls">
                  <button id="analyze-now" class="btn btn-outline-secondary" type="button">Analyze now</button>
                  <button id="end-session" class="btn btn-outline-secondary" type="button">End session</button>
                  <button id="undo-action" class="btn btn-outline-secondary" type="button">Undo</button>
                </div>
                <p id="session-meta" class="small text-body-secondary mb-0">No active session.</p>
              </div>

              <div class="card">
                <div class="card-body p-0">
                  <div id="live-markdown-pane" class="hljs small font-monospace p-3 mb-0"></div>
                </div>
              </div>

              <div class="card">
                <div class="card-body p-0">
                  <div id="live-transcript-pane" class="hljs small font-monospace p-3 mb-0 overflow-auto" style="max-height: 300px;"></div>
                </div>
              </div>

              <div id="mock-transcript-card" class="card d-none">
                <div class="card-body">
                  <h2 class="h6 card-title">Mock Transcript Input</h2>
                  <div class="mb-3">
                    <label class="form-label small" for="mock-transcript">Use this while running with the mock STT provider.</label>
                    <textarea id="mock-transcript" class="form-control form-control-sm" rows="4"></textarea>
                  </div>
                  <button id="send-mock-transcript" class="btn btn-sm btn-outline-secondary" type="button">Send transcript</button>
                </div>
              </div>
            </div>
          </section>

          <section id="tab-history" class="tab-panel d-none">
            <div class="card">
              <div class="card-body">
                <h2 class="h6 card-title">Session Index</h2>
                <div id="history-list" class="vstack gap-2 text-body-secondary small">No sessions yet.</div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
